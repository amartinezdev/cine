name: Deploy a cPanel

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # vendor/ NO se toca aqui a proposito: se gestiona a mano por FTP.
      # Subir vendor/ (miles de archivos) por FTP en cada push es demasiado
      # lento en este hosting. Si cambias una dependencia en composer.json,
      # genera vendor/ en local (composer install --no-dev) y subelo tu
      # mismo a laravel_apps/cine/vendor por FTP, como la primera vez.

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias de npm y compilar assets
        run: |
          npm ci
          npm run build

      - name: Preparar carpeta de la aplicacion (cine_app)
        run: |
          mkdir -p deploy_stage/cine_app
          rsync -a \
            --exclude='public' \
            --exclude='tests' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='deploy' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.example' \
            --exclude='.editorconfig' \
            --exclude='.gitattributes' \
            --exclude='.gitignore' \
            --exclude='phpunit.xml' \
            --exclude='README.md' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='vite.config.js' \
            --exclude='tailwind.config.js' \
            --exclude='postcss.config.js' \
            --exclude='deploy_stage' \
            ./ deploy_stage/cine_app/
          cp deploy/app.bootstrap.php deploy_stage/cine_app/bootstrap/app.php

      - name: Preparar carpeta publica (public_html)
        run: |
          mkdir -p deploy_stage/public_html
          cp -r public/build deploy_stage/public_html/build
          cp -r public/images deploy_stage/public_html/images
          cp public/.htaccess deploy_stage/public_html/.htaccess
          cp public/favicon.ico deploy_stage/public_html/favicon.ico
          cp public/robots.txt deploy_stage/public_html/robots.txt
          cp deploy/index.public_html.php deploy_stage/public_html/index.php

      - name: Desplegar app por FTPS (laravel_apps/cine)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          local-dir: deploy_stage/cine_app/
          server-dir: laravel_apps/cine/
          dangerous-clean-slate: false

      - name: Desplegar archivos publicos por FTPS (public_html/cine)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          local-dir: deploy_stage/public_html/
          server-dir: public_html/cine/
          dangerous-clean-slate: false
